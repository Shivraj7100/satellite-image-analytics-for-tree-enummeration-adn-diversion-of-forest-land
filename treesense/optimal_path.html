<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Land Assessment — TreeSense</title>
  <link rel="stylesheet" href="src/assets/css/styles.css">
  <script src="src/assets/js/script.js"></script>
</head>
<body>
  <main class="container workspace">
    <div class="page-head"><span class="eyebrow">Land assessment</span><h1>Vegetation and idle-land view</h1><p>Convert imagery into a clear vegetation map for planning review.</p></div>
    <section class="panel upload-panel">
      <div class="toolbar"><input class="file-input" type="file" id="image-file" accept="image/*"><button class="btn" id="process-button" type="button">Analyze land</button></div>
      <p id="status" role="status"></p>
      <div class="image-grid">
        <article class="image-card"><h3>Original</h3><img id="uploaded-image" alt="Uploaded land image"></article>
        <article class="image-card"><h3>Land classification</h3><img id="processed-image" alt="Processed land classification"></article>
      </div>
      <div class="status-row"><div class="metric"><span>Vegetation</span><strong id="green-cover-percentage">—</strong></div><div class="metric"><span>Other / idle land</span><strong id="idle-land-percentage">—</strong></div></div>
    </section>
  </main>
<script>
const fileInput=document.getElementById('image-file'),status=document.getElementById('status'),uploaded=document.getElementById('uploaded-image'),processed=document.getElementById('processed-image');
function analyze(){const file=fileInput.files?.[0];if(!file){status.textContent='Please select an image first.';return}status.textContent='Analyzing…';const reader=new FileReader();reader.onload=()=>{uploaded.src=reader.result;const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);const image=ctx.getImageData(0,0,canvas.width,canvas.height),p=image.data;let vegetation=0,total=0;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];const isVegetation=g>r*1.08&&g>b*1.08&&g>70;if(isVegetation)vegetation++;total++;p[i]=isVegetation?54:235;p[i+1]=isVegetation?145:235;p[i+2]=isVegetation?78:235}ctx.putImageData(image,0,0);const percent=total?vegetation/total*100:0;processed.src=canvas.toDataURL('image/jpeg',.9);document.getElementById('green-cover-percentage').textContent=`${percent.toFixed(2)}%`;document.getElementById('idle-land-percentage').textContent=`${(100-percent).toFixed(2)}%`;status.textContent='Analysis complete.'};img.src=reader.result};reader.readAsDataURL(file)}
document.getElementById('process-button').addEventListener('click',analyze);fileInput.addEventListener('change',analyze);
</script>
</body>
</html>
