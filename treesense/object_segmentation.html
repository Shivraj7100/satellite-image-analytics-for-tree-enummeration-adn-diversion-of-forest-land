<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Cover Estimator</title>
  <link rel="stylesheet" href="src/assets/css/styles.css">
  <script src="src/assets/js/script.js"></script>
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

h2, h3 {
  color: #333;
  padding: 20px;
}

h3 {
  display: flex;
  align-items: center;
}

input[type="file"] {
  display: block;
  margin: 20px;
}

button {
  background-color: #4CAF50; /* Green */
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
}

.image-container {
  display: flex;
  justify-content: space-around;
}

.image-container img {
  max-width: calc(50% - 40px);
}

#green-cover-percentage {
  font-size: 24px;
}
#idle-land-percentage{
  font-size: 24px;
}
  </style>
</head>
<body>
  <main class="container workspace">
    <div class="page-head"><span class="eyebrow">Vegetation analysis</span><h1>Green cover estimator</h1><p>Upload an aerial or satellite image to estimate vegetation coverage.</p></div>
    <section class="panel upload-panel">
      <div class="toolbar"><input class="file-input" type="file" id="image-file" accept="image/*"><button class="btn" id="process-button" type="button">Process image</button></div>
      <p id="status" role="status"></p>
      <div class="image-grid">
        <article class="image-card"><h3>Original</h3><img id="uploaded-image" alt="Uploaded satellite or aerial image"></article>
        <article class="image-card"><h3>Processed</h3><img id="processed-image" alt="Processed green cover image"></article>
      </div>
      <div class="status-row"><div class="metric"><span>Estimated green cover</span><strong id="green-cover-percentage">—</strong></div><div class="metric"><span>Estimated non-green area</span><strong id="idle-land-percentage">—</strong></div></div>
    </section>
  </main>
<script>
const fileInput=document.getElementById('image-file'),uploaded=document.getElementById('uploaded-image'),processed=document.getElementById('processed-image'),status=document.getElementById('status');
function processImage(){const file=fileInput.files?.[0];if(!file){status.textContent='Please select an image first.';return}if(!file.type.startsWith('image/')){status.textContent='Please select a valid image file.';return}status.textContent='Processing…';const reader=new FileReader();reader.onload=()=>{uploaded.src=reader.result;const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=data.data;let greenPixels=0,total=0;for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2];const vegetation=g>r*1.05&&g>b*1.05&&g>75;if(vegetation)greenPixels++;total++}for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2];const vegetation=g>r*1.05&&g>b*1.05&&g>75;pixels[i]=vegetation?38:220;pixels[i+1]=vegetation?160:220;pixels[i+2]=vegetation?72:220;pixels[i+3]=255}ctx.putImageData(data,0,0);const green=total?greenPixels/total*100:0;processed.src=canvas.toDataURL('image/jpeg',.9);document.getElementById('green-cover-percentage').textContent=`${green.toFixed(2)}%`;document.getElementById('idle-land-percentage').textContent=`${(100-green).toFixed(2)}%`;status.textContent='Analysis complete.'};img.src=reader.result};reader.readAsDataURL(file)}
fileInput.addEventListener('change',processImage);document.getElementById('process-button').addEventListener('click',processImage);
</script>
</body>
</html>
