<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Boundary — TreeSense</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="src/assets/css/styles.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="src/assets/js/script.js"></script>
  <style>
    .map-shell {
        height: 520px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
    }
    #map {
        height: 100%;
    }
  </style>
</head>
<body>
  <main class="container workspace">
    <div class="page-head">
      <span class="eyebrow">Area selection</span>
      <h1>Map boundary</h1>
      <p>Click two points to draw a rectangular study area.</p>
    </div>
    <section class="panel upload-panel">
      <p id="status" role="status">Choose the first corner.</p>
      <div class="map-shell">
        <div id="map" aria-label="Interactive map"></div>
      </div>
      <div class="status-row">
        <div class="metric">
          <span>Northwest corner</span>
          <strong id="northwest">—</strong>
        </div>
        <div class="metric">
          <span>Southeast corner</span>
          <strong id="southeast">—</strong>
        </div>
      </div>
    </section>
  </main>
  <script>
    const map = L.map('map').setView([23.2599, 77.4126], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);
    let first = null,
        rectangle = null,
        marker = null;
    map.on('click', event => {
        if (!first) {
            first = event.latlng;
            marker = L.circleMarker(first, {
                radius: 6,
                color: '#1f7a4d',
                fillOpacity: .9
            }).addTo(map);
            document.getElementById('status').textContent = 'Choose the opposite corner.';
        } else {
            if (rectangle) rectangle.remove();
            const second = event.latlng,
                bounds = L.latLngBounds(first, second);
            rectangle = L.rectangle(bounds, {
                color: '#1f7a4d',
                weight: 2,
                fillOpacity: .12
            }).addTo(map);
            if (marker) {
                marker.remove();
                marker = null
            }
            const sw = bounds.getSouthWest(),
                ne = bounds.getNorthEast();
            document.getElementById('northwest').textContent = `${ne.lat.toFixed(5)}, ${sw.lng.toFixed(5)}`;
            document.getElementById('southeast').textContent = `${sw.lat.toFixed(5)}, ${ne.lng.toFixed(5)}`;
            document.getElementById('status').textContent = 'Study area selected. Click the map to draw a new area.';
            first = null
        }
    });
  </script>
</body>
</html>
