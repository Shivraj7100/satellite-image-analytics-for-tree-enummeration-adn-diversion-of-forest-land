<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree Enumeration — TreeSense</title>
  <link rel="stylesheet" href="src/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="src/assets/js/script.js"></script>
</head>
<body>
  <main class="container workspace">
    <div class="page-head">
      <span class="eyebrow">Object detection</span>
      <h1>Tree enumeration</h1>
      <p>Upload an aerial image to detect and count tree objects.</p>
    </div>
    <section class="panel upload-panel">
      <div class="toolbar">
        <input class="file-input" id="uploadInput" type="file" accept="image/*">
      </div>
      <p id="status" role="status">Select an image to begin.</p>
      <div class="canvas-wrap">
        <canvas id="resultCanvas"></canvas>
      </div>
      <div class="status-row">
        <div class="metric">
          <span>Detected objects</span>
          <strong id="objectCount">0</strong>
        </div>
        <div class="metric">
          <span>Confidence threshold</span>
          <strong>50%</strong>
        </div>
      </div>
    </section>
  </main>
  <script>
    const input = document.getElementById('uploadInput'),
          canvas = document.getElementById('resultCanvas'),
          status = document.getElementById('status'),
          count = document.getElementById('objectCount');
    let session;

    async function loadModel() {
      if (!session) {
        session = await ort.InferenceSession.create('https://ml-cdn.vipulchaturvedi.com/100going1000.onnx', { executionProviders: ['wasm'] });
      }
      return session;
    }

    async function analyze(file) {
      if (!file?.type.startsWith('image/')) {
        status.textContent = 'Please select a valid image file.';
        return;
      }
      status.textContent = 'Preparing image…';
      const url = URL.createObjectURL(file),
            img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const tensorCanvas = document.createElement('canvas');
      tensorCanvas.width = 640;
      tensorCanvas.height = 640;
      const tensorCtx = tensorCanvas.getContext('2d', { willReadFrequently: true });
      tensorCtx.drawImage(img, 0, 0, 640, 640);
      const pixels = tensorCtx.getImageData(0, 0, 640, 640).data,
            r = [], g = [], b = [];
      for (let i = 0; i < pixels.length; i += 4) {
        r.push(pixels[i] / 255);
        g.push(pixels[i + 1] / 255);
        b.push(pixels[i + 2] / 255);
      }
      try {
        status.textContent = 'Running tree detection…';
        const model = await loadModel(),
              inputTensor = new ort.Tensor('float32', Float32Array.from([...r, ...g, ...b]), [1, 3, 640, 640]),
              outputs = await model.run({ images: inputTensor }),
              output = outputs.output0?.data || Object.values(outputs)[0].data,
              boxes = processOutput(output, img.naturalWidth, img.naturalHeight);
        drawBoxes(ctx, boxes);
        count.textContent = boxes.length;
        status.textContent = `Analysis complete — ${boxes.length} tree object${boxes.length === 1 ? '' : 's'} found.`;
      } catch (error) {
        console.error(error);
        status.textContent = 'The detection model could not be loaded. Check your connection and try again.';
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function processOutput(output, width, height) {
      const boxes = [];
      for (let i = 0; i < 8400; i++) {
        let best = [0, 0];
        for (let c = 0; c < 80; c++) {
          const value = output[8400 * (c + 4) + i];
          if (value > best[1]) best = [c, value];
        }
        if (best[1] < .5) continue;
        const xc = output[i],
              yc = output[8400 + i],
              w = output[16800 + i],
              h = output[25200 + i],
              scaleX = width / 640,
              scaleY = height / 640,
              x1 = (xc - w / 2) * scaleX,
              y1 = (yc - h / 2) * scaleY,
              x2 = (xc + w / 2) * scaleX,
              y2 = (yc + h / 2) * scaleY;
        boxes.push([x1, y1, x2, y2, 'tree', best[1]]);
      }
      boxes.sort((a, b) => b[5] - a[5]);
      const kept = [];
      while (boxes.length) {
        const box = boxes.shift();
        kept.push(box);
        for (let i = boxes.length - 1; i >= 0; i--) {
          if (iou(box, boxes[i]) > .7) boxes.splice(i, 1);
        }
      }
      return kept;
    }

    function iou(a, b) {
      const x1 = Math.max(a[0], b[0]),
            y1 = Math.max(a[1], b[1]),
            x2 = Math.min(a[2], b[2]),
            y2 = Math.min(a[3], b[3]);
      const intersection = Math.max(0, x2 - x1) * Math.max(0, y2 - y1),
            area = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - intersection;
      return area ? intersection / area : 0;
    }

    function drawBoxes(ctx, boxes) {
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = Math.max(2, ctx.canvas.width / 500);
      ctx.font = `${Math.max(14, ctx.canvas.width / 45)}px Segoe UI`;
      boxes.forEach(([x1, y1, x2, y2, label, prob]) => {
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const text = `${label} ${Math.round(prob * 100)}%`,
              width = ctx.measureText(text).width + 12;
        ctx.fillStyle = 'rgba(22,101,52,.92)';
        ctx.fillRect(x1, Math.max(0, y1 - 26), width, 26);
        ctx.fillStyle = '#fff';
        ctx.fillText(text, x1 + 6, Math.max(18, y1 - 7));
      });
    }

    input.addEventListener('change', event => analyze(event.target.files[0]));
  </script>
</body>
</html>
