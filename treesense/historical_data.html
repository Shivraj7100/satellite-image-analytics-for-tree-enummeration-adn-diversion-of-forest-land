<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate Data — TreeSense</title>
  <link rel="icon" href="public/images/favicon.ico">
  <link rel="stylesheet" href="src/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
        body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  padding: 20px;
}

h1, h2 {
  color: #006400; /* Dark Green */
}

form {
  margin-bottom: 20px;
}

input[type="text"] {
  padding: 10px;
  width: 70%;
  margin-right: 10px;
}

button {
  padding: 10px;
  background-color: #32CD32; /* Lime Green */
  color: white;
  border: none;
}

button:hover {
  background-color: #228B22; /* Forest Green */
}

#weather {
  margin-top: 20px;
}

canvas {
  width: 100%;
}

/* Responsive styles */
@media (max-width: 600px) {
    input[type="text"] {
        width: auto;
    }
}

    </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html"><img src="public/images/treeicon.png" alt=""><span>TreeSense</span></a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="predict.html">Analytics</a><a class="active" href="historical_data.html">Climate</a></nav>
    </div>
  </header>
  <main class="container workspace">
    <div class="page-head"><span class="eyebrow">Climate workspace</span><h1>Weather & rainfall context</h1><p>Search a location to view current conditions and a seven-day forecast.</p></div>
    <section class="panel upload-panel">
      <form id="location-form" class="toolbar">
        <input class="file-input" type="search" id="location" placeholder="Enter city or location" aria-label="Location" required>
        <button class="btn" type="submit" id="get-weather">Get weather</button>
      </form>
      <p id="weather-status" role="status"></p>
      <div id="weather" hidden>
        <div class="status-row"><div class="metric"><span>Temperature</span><strong id="temperature">—</strong></div><div class="metric"><span>Wind</span><strong id="wind">—</strong></div></div>
        <div class="chart-wrap" style="margin-top:18px"><canvas id="historical-chart"></canvas></div>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container footer-inner"><span>© 2026 TreeSense Imaging</span><a href="predict.html">Open analytics</a></div></footer>
  <script src="src/assets/js/script.js"></script>
  <script src="src/assets/js/app.js"></script>
</body>
</html>
