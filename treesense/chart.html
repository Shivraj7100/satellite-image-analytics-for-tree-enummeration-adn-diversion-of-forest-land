<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate Charts — TreeSense</title>
  <link rel="stylesheet" href="src/assets/css/styles.css">
</head>
<body>
  <main class="container workspace">
    <div class="page-head"><span class="eyebrow">Historical data</span><h1>Climate charts</h1><p>View rainfall history or search live weather context.</p></div>
    <div class="workspace-grid">
      <aside class="panel side-nav"><button class="active" type="button" data-page="rainfall.html">Rainfall</button><button type="button" data-page="historical_data.html">Weather search</button></aside>
      <section class="panel iframe-shell"><iframe id="chart-frame" title="Climate chart" src="rainfall.html"></iframe></section>
    </div>
  </main>
  <script>
    const frame=document.getElementById('chart-frame');
    document.querySelectorAll('.side-nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.side-nav button').forEach(item=>item.classList.remove('active'));button.classList.add('active');frame.src=button.dataset.page;}));
  </script>
</body>
</html>
